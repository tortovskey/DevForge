name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEVFORGE_DATA_DIR: ${{ github.workspace }}/IDE/Source/build/ci-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: IDE/Source/frontend/package-lock.json
      - run: python -m pip install --upgrade "pip>=26.2,<27"
      - run: pip install -r requirements.txt
        working-directory: IDE/Source/backend
      - run: npm ci
        working-directory: IDE/Source/frontend
      - run: npm run typecheck
        working-directory: IDE/Source/frontend
      - run: npm run build
        working-directory: IDE/Source/frontend
      - run: npm run test:runner
        working-directory: IDE/Source/frontend
      - run: python -m pytest -q
        working-directory: IDE/Source/backend
